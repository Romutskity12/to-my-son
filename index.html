<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To My Son</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,600&family=Lato:wght@300;400&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh; height: 100vh;
      background: #080604;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }

    /* Atmospheric background — lamp halos baked in */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 110px 180px at 7vw 26vh,  rgba(255,215,100,0.16) 0%, transparent 100%),
        radial-gradient(ellipse 110px 180px at 93vw 26vh, rgba(255,215,100,0.16) 0%, transparent 100%),
        radial-gradient(ellipse 320px 500px at 7vw 26vh,  rgba(180,130,40,0.07)  0%, transparent 100%),
        radial-gradient(ellipse 320px 500px at 93vw 26vh, rgba(180,130,40,0.07)  0%, transparent 100%),
        radial-gradient(ellipse at 50% 60%, rgba(80,55,10,0.06) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* ──────────────── LAMP POSTS ──────────────── */
    .lamp-svg {
      position: fixed; bottom: 0;
      height: 80vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.92;
    }
    .lamp-l { left: 2vw; }
    .lamp-r { right: 2vw; transform: scaleX(-1); }

    @keyframes lampFlicker {
      0%,100% { opacity: 0.92; }
      48%      { opacity: 1; }
      50%      { opacity: 0.88; }
      52%      { opacity: 1; }
      80%      { opacity: 0.95; }
    }
    .lamp-svg { animation: lampFlicker 6s ease-in-out infinite; }

    @media (max-width: 700px) { .lamp-svg { display: none; } }

    /* ──────────────── MUSIC BUTTON ──────────────── */
    #musicBtn {
      position: fixed; top: 18px; right: 20px; z-index: 100;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.35);
      background: rgba(12,8,2,0.75); backdrop-filter: blur(6px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: rgba(201,169,110,0.85);
      transition: background 0.3s, transform 0.2s, opacity 0.3s;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      opacity: 0.5; animation: fadeIn 1.5s ease both;
    }
    #musicBtn:hover { background: rgba(201,169,110,0.18); transform: scale(1.08); opacity: 1; }
    #musicBtn.playing { opacity: 1; }

    /* ──────────────── SCREENS ──────────────── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; transition: opacity 0.6s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ──────────────── SCREEN 1 ──────────────── */
    #s1 { flex-direction: column; gap: 44px; }

    .figure-wrap { animation: fadeUp 1s ease both; }
    .figure-svg {
      filter:
        drop-shadow(0 0 14px rgba(201,160,70,0.55))
        drop-shadow(0 0 38px rgba(160,110,30,0.3));
    }

    .folder-wrap {
      cursor: pointer; user-select: none;
      position: relative;
      animation: fadeUp 1s 0.22s ease both;
    }

    /* Dark leather folder */
    .folder-body {
      width: 280px; height: 185px;
      background: linear-gradient(145deg, #1E1409 0%, #161008 55%, #1B1208 100%);
      border-radius: 4px 16px 8px 8px;
      position: relative;
      box-shadow:
        inset 0 0 0 1px rgba(201,169,80,0.28),
        inset 0 1px 0 rgba(255,230,140,0.12),
        0 0 26px 7px  rgba(210,175,80,0.48),
        0 0 72px 26px rgba(185,135,40,0.28),
        0 0 140px 55px rgba(145,95,20,0.18);
      transition: transform 0.25s ease;
      transform: translateZ(0); will-change: transform;
    }
    .folder-wrap:hover .folder-body {
      transform: translateY(-6px) scale(1.02) translateZ(0);
    }

    /* Pulsing glow — GPU only (opacity + scale) */
    .folder-glow {
      position: absolute; inset: -55px;
      background: radial-gradient(ellipse at center,
        rgba(220,185,80,0.45) 0%, rgba(180,130,40,0.18) 45%, transparent 70%);
      border-radius: 50%; pointer-events: none; z-index: -1;
      animation: pulseGlow 3.4s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes pulseGlow {
      0%,100% { opacity: 0.72; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.2); }
    }

    /* Dark leather tab */
    .folder-tab {
      position: absolute; top: -26px; left: 0;
      width: 105px; height: 30px;
      background: linear-gradient(to bottom, #2A1C0A, #181008);
      border: 1px solid rgba(201,169,80,0.22); border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    /* Gold top-edge line */
    .folder-body::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 1px;
      background: rgba(201,169,80,0.38);
      border-radius: 4px 16px 0 0;
    }

    /* Leather texture vertical lines */
    .folder-body::after {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        to right,
        transparent, transparent 18px,
        rgba(0,0,0,0.08) 18px, rgba(0,0,0,0.08) 19px
      );
      border-radius: 4px 16px 8px 8px;
      pointer-events: none;
    }

    /* Gold label on dark */
    .folder-label-text {
      position: absolute; bottom: 32px; left: 0; right: 0;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: 30px; font-weight: 700;
      color: #C9A96E;
      text-shadow: 0 0 20px rgba(201,169,80,0.55), 0 1px 3px rgba(0,0,0,0.6);
      z-index: 1;
    }

    .click-hint {
      position: absolute; bottom: -30px; left: 0; right: 0;
      text-align: center;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(201,169,110,0.5);
    }

    /* ──────────────── SCREEN 2 ──────────────── */
    #s2 { flex-direction: column; }

    .open-folder-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }

    .open-folder-box {
      position: relative; width: min(615px, 96vw);
      filter:
        drop-shadow(0 0 28px rgba(201,160,70,0.38))
        drop-shadow(0 0 75px rgba(165,115,30,0.2));
    }

    /* Dark leather back cover (visible when open) */
    .open-flap {
      width: 100%; height: 48px;
      background: linear-gradient(to bottom, #2A1C0A, #181008);
      border-top: 1px solid rgba(201,169,80,0.25);
      border-radius: 8px 8px 0 0;
      transform: perspective(300px) rotateX(-25deg);
      transform-origin: bottom; position: relative;
    }
    .open-flap::before {
      content: ''; position: absolute;
      top: -26px; left: 0; width: 115px; height: 30px;
      background: #1A1008;
      border: 1px solid rgba(201,169,80,0.2); border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    /* Warm interior */
    .open-body {
      width: 100%;
      background: linear-gradient(160deg, #C8A045 0%, #A87028 100%);
      border-radius: 0 0 14px 14px;
      padding: 28px 22px 26px;
    }

    .envelopes-row {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }

    /* ── Envelope ── */
    .env {
      width: 140px; height: 98px;
      background: #FFFAF3; border-radius: 3px;
      position: relative; cursor: pointer;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.22);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
    }
    .env:hover {
      transform: translateY(-10px) rotate(-1.5deg);
      box-shadow: 3px 14px 28px rgba(0,0,0,0.32), 0 0 16px rgba(255,220,140,0.2);
    }

    .env-flap {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 49px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: #EDD9B5;
    }
    .env-bot {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 49px;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: #E8CFA0;
    }
    .env-lft {
      position: absolute; top: 0; left: 0;
      width: 50%; height: 100%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #F0DDB8;
    }
    .env-rgt {
      position: absolute; top: 0; right: 0;
      width: 50%; height: 100%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      background: #F0DDB8;
    }

    /* Plain wax seal — no symbol */
    .env-seal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 24px; height: 24px;
      background: radial-gradient(circle at 38% 32%, #CC3838, #7A1010);
      border-radius: 50%; z-index: 5;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,180,180,0.2);
    }

    /* P.S. seal — dark navy */
    .env-seal-ps {
      background: radial-gradient(circle at 38% 32%, #2E5FA8, #0F2A60);
    }

    .env-ps { background: #F5F8FF; }
    .env-ps .env-flap { background: #D5DFEE; }
    .env-ps .env-bot  { background: #C8D5E8; }
    .env-ps .env-lft  { background: #DDEAF8; }
    .env-ps .env-rgt  { background: #DDEAF8; }

    /* Number badge */
    .env-num {
      position: absolute; top: 6px; left: 8px;
      width: 20px; height: 20px;
      background: rgba(74,44,16,0.16);
      border-radius: 50%; z-index: 7;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Lato', sans-serif; font-size: 10px; font-weight: 700;
      color: #4A2C10;
    }
    .env-ps .env-num { background: rgba(26,48,96,0.14); color: #1A3060; }

    .env-name {
      position: absolute; bottom: 10px; left: 0; right: 0;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: 15px; font-weight: 700;
      color: #4A2C10; z-index: 6;
    }
    .env-ps .env-name { color: #1A3060; }

    /* ── Buttons ── */
    .btn-light {
      padding: 9px 26px; background: transparent;
      border: 1px solid rgba(201,169,110,0.38);
      color: rgba(201,169,110,0.78); border-radius: 30px; cursor: pointer;
      font-family: 'Lato', sans-serif; font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase; transition: all 0.3s;
    }
    .btn-light:hover { background: rgba(201,169,110,0.12); color: rgba(225,195,135,1); }

    .btn-dark {
      padding: 9px 26px; background: transparent;
      border: 1px solid rgba(201,169,110,0.32);
      color: rgba(201,169,110,0.72); border-radius: 30px; cursor: pointer;
      font-family: 'Lato', sans-serif; font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase; transition: all 0.3s;
    }
    .btn-dark:hover { background: rgba(201,169,110,0.1); color: rgba(225,195,135,1); }

    /* ──────────────── SCREEN 3 ──────────────── */
    #s3 {
      flex-direction: column; gap: 18px;
      padding: 24px 16px; overflow-y: auto; align-items: center;
    }

    .letter-paper {
      width: min(500px, 94vw); background: #FFFEF9; border-radius: 2px;
      padding: clamp(32px,5vw,52px) clamp(28px,6vw,54px);
      position: relative; transform-origin: top center;
      will-change: transform, opacity;
      animation: unfold 0.45s cubic-bezier(0.34,1.2,0.64,1) both;
      box-shadow:
        0 0 50px rgba(255,245,210,0.1),
        0 6px 40px rgba(0,0,0,0.55);
    }
    .letter-paper::before {
      content: ''; position: absolute; top: 0; bottom: 0;
      left: clamp(52px,12%,72px); width: 1px;
      background: rgba(200,100,100,0.22);
    }
    .letter-paper::after {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        transparent, transparent 31px,
        rgba(170,195,220,0.18) 31px, rgba(170,195,220,0.18) 32px
      );
      pointer-events: none; border-radius: 2px;
    }

    .letter-paper.ps-paper { background: #F7FAFF; }
    .letter-paper.ps-paper::before { background: rgba(80,120,200,0.18); }

    @keyframes unfold {
      from { transform: scaleY(0.04); opacity: 0; }
      to   { transform: scaleY(1);    opacity: 1; }
    }

    .letter-theme {
      font-family: 'Dancing Script', cursive;
      font-size: 32px; font-weight: 700;
      color: #C0392B; text-align: center; margin-bottom: 26px;
      position: relative; z-index: 1;
    }
    .letter-theme.ps-theme { color: #1A4A8B; }

    .letter-text {
      font-family: 'Lato', sans-serif; font-weight: 300;
      font-size: 15.5px; line-height: 1.95; color: #2A1808;
      position: relative; z-index: 1;
    }

    .letter-sig {
      margin-top: 30px; text-align: right;
      font-family: 'Dancing Script', cursive;
      font-size: 26px; color: #8B4513;
      position: relative; z-index: 1;
    }
    .letter-sig.ps-sig { color: #1A4A8B; }

    /* ──────────────── KEYFRAMES ──────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    @media (max-width: 440px) {
      .env { width: 125px; height: 88px; }
      .env-name { font-size: 13px; }
      .open-body { padding: 18px 12px; }
    }
  </style>
</head>
<body>

<!-- ══ LAMP POSTS ══ -->
<!-- Left lamp -->
<svg class="lamp-svg lamp-l" viewBox="0 0 130 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="haloL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD870" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFD870" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD870" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFD870" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="poleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4A3010"/>
      <stop offset="45%"  stop-color="#2A1A08"/>
      <stop offset="100%" stop-color="#3C2810"/>
    </linearGradient>
  </defs>

  <!-- Pole -->
  <rect x="20" y="135" width="7" height="615" rx="3.5" fill="url(#poleG)"/>

  <!-- Curved arm -->
  <path d="M24 142 Q26 100 95 82" stroke="#3A2808" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- Lantern cap -->
  <rect x="83" y="58" width="30" height="9" rx="2" fill="#1E1208" stroke="rgba(201,169,80,0.3)" stroke-width="1"/>
  <!-- Lantern body -->
  <rect x="86" y="66" width="24" height="32" rx="3"
        fill="#141008" stroke="rgba(201,169,80,0.25)" stroke-width="1"/>
  <!-- Lantern base -->
  <path d="M86 98 L90 110 L106 110 L110 98 Z" fill="#161008"/>
  <!-- Hook from arm to lantern -->
  <line x1="96" y1="82" x2="98" y2="66" stroke="#3A2808" stroke-width="2"/>

  <!-- Glass glow -->
  <rect x="90" y="70" width="16" height="22" rx="2" fill="rgba(255,228,150,0.9)"/>
  <!-- Glass highlight -->
  <rect x="90" y="70" width="5" height="22" rx="1" fill="rgba(255,255,255,0.15)"/>

  <!-- Halo -->
  <ellipse cx="98" cy="88" rx="68" ry="52" fill="url(#haloL)"/>

  <!-- Light cone -->
  <path d="M98 110 L10 420 L186 420 Z" fill="url(#coneL)"/>
</svg>

<!-- Right lamp (mirrored via CSS) -->
<svg class="lamp-svg lamp-r" viewBox="0 0 130 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="haloR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD870" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFD870" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD870" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFD870" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="20" y="135" width="7" height="615" rx="3.5" fill="url(#poleG)"/>
  <path d="M24 142 Q26 100 95 82" stroke="#3A2808" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="83" y="58" width="30" height="9" rx="2" fill="#1E1208" stroke="rgba(201,169,80,0.3)" stroke-width="1"/>
  <rect x="86" y="66" width="24" height="32" rx="3" fill="#141008" stroke="rgba(201,169,80,0.25)" stroke-width="1"/>
  <path d="M86 98 L90 110 L106 110 L110 98 Z" fill="#161008"/>
  <line x1="96" y1="82" x2="98" y2="66" stroke="#3A2808" stroke-width="2"/>
  <rect x="90" y="70" width="16" height="22" rx="2" fill="rgba(255,228,150,0.9)"/>
  <rect x="90" y="70" width="5" height="22" rx="1" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="98" cy="88" rx="68" ry="52" fill="url(#haloR)"/>
  <path d="M98 110 L10 420 L186 420 Z" fill="url(#coneR)"/>
</svg>

<!-- Hidden YouTube player -->
<div id="ytplayer" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;"></div>

<!-- Music toggle -->
<button id="musicBtn" onclick="toggleMusic()">♪</button>

<!-- ══════════════ SCREEN 1: INTRO ══════════════ -->
<div class="screen" id="s1">

  <div class="figure-wrap">
    <svg class="figure-svg" width="96" height="155" viewBox="0 0 96 155" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fg" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%"   stop-color="#C9A85A" stop-opacity="0.78"/>
          <stop offset="100%" stop-color="#7A5010" stop-opacity="0.92"/>
        </linearGradient>
      </defs>
      <circle cx="48" cy="19" r="15" fill="url(#fg)"/>
      <rect   x="42" y="31" width="12" height="9" rx="3" fill="url(#fg)"/>
      <path d="M16 53 Q20 38 48 38 Q76 38 80 53 L76 108 Q48 114 20 108 Z" fill="url(#fg)"/>
      <path d="M20 56 L5 93 Q3 99 7 101 L22 106 Q27 102 25 95 Z" fill="url(#fg)"/>
      <path d="M76 56 L91 93 Q93 99 89 101 L74 106 Q69 102 71 95 Z" fill="url(#fg)"/>
      <path d="M24 106 L20 148 Q20 153 26 153 L37 153 Q41 153 41 148 L40 106 Z" fill="url(#fg)"/>
      <path d="M72 106 L76 148 Q76 153 70 153 L59 153 Q55 153 55 148 L56 106 Z" fill="url(#fg)"/>
      <g transform="translate(48,70)">
        <path d="M0,-12 C-2.5,-19 -15,-19 -15,-8 C-15,1 0,13 0,13 C0,13 15,1 15,-8 C15,-19 2.5,-19 0,-12 Z"
              fill="#C0392B" opacity="0.97"/>
        <text x="0" y="5" text-anchor="middle"
              font-family="Playfair Display, serif"
              font-style="italic" font-size="7"
              fill="rgba(255,255,255,0.92)">Son</text>
      </g>
    </svg>
  </div>

  <div class="folder-wrap" onclick="openFolder()">
    <div class="folder-body">
      <div class="folder-glow"></div>
      <div class="folder-tab"></div>
      <div class="folder-label-text">To My Son</div>
    </div>
    <div class="click-hint">click to open</div>
  </div>

</div>

<!-- ══════════════ SCREEN 2: OPEN FOLDER ══════════════ -->
<div class="screen hidden" id="s2">
  <div class="open-folder-wrap">
    <div class="open-folder-box">
      <div class="open-flap"></div>
      <div class="open-body">
        <div class="envelopes-row">

          <div class="env" onclick="openLetter(0)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal"></div>
            <div class="env-num">1</div><div class="env-name">Pride</div>
          </div>

          <div class="env" onclick="openLetter(1)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal"></div>
            <div class="env-num">2</div><div class="env-name">Trust</div>
          </div>

          <div class="env" onclick="openLetter(2)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal"></div>
            <div class="env-num">3</div><div class="env-name">Strength</div>
          </div>

          <div class="env" onclick="openLetter(3)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal"></div>
            <div class="env-num">4</div><div class="env-name">Hope</div>
          </div>

          <div class="env" onclick="openLetter(4)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal"></div>
            <div class="env-num">5</div><div class="env-name">Together</div>
          </div>

          <div class="env env-ps" onclick="openLetter(5)">
            <div class="env-flap"></div><div class="env-lft"></div>
            <div class="env-rgt"></div><div class="env-bot"></div>
            <div class="env-seal env-seal-ps"></div>
            <div class="env-num">6</div><div class="env-name">P.S.</div>
          </div>

        </div>
      </div>
    </div>
    <button class="btn-light" onclick="goTo('s1')">← Close</button>
  </div>
</div>

<!-- ══════════════ SCREEN 3: LETTER ══════════════ -->
<div class="screen hidden" id="s3">
  <div class="letter-paper" id="letterPaper">
    <div class="letter-theme" id="letterTheme"></div>
    <div class="letter-text"  id="letterText"></div>
    <div class="letter-sig"   id="letterSig"></div>
  </div>
  <button class="btn-dark" onclick="goTo('s2')">← Back to letters</button>
</div>

<script>
  /* ── YouTube audio ── */
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  var ytPlayer, musicStarted = false, muted = false, playerReady = false;

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('ytplayer', {
      height: '1', width: '1',
      videoId: 'kPa7bsKwL-c',
      playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, rel:0 },
      events: { onReady: function() { playerReady = true; } }
    });
  }

  function startMusic() {
    if (musicStarted) return;
    if (playerReady && ytPlayer && ytPlayer.playVideo) {
      ytPlayer.setVolume(40);
      ytPlayer.playVideo();
      musicStarted = true;
      document.getElementById('musicBtn').classList.add('playing');
    }
  }

  function toggleMusic() {
    if (!musicStarted) { startMusic(); return; }
    muted = !muted;
    if (ytPlayer) { muted ? ytPlayer.mute() : ytPlayer.unMute(); }
    document.getElementById('musicBtn').textContent = muted ? '♩' : '♪';
  }

  /* ── Letters ── */
  const letters = [
    { theme:'Pride',    sig:'— Your Father', ps:false,
      text:'I am proud of my son. When he left military service, he walked into the unknown — no clear path, no certainty. And look at who he has become today. That is my greatest reward. Perhaps I never told you this, but know that every father is sincerely proud of his son.' },
    { theme:'Trust',    sig:'— Your Father', ps:false,
      text:'When I fell ill, I could not share this pain with anyone. You were the only one I could show it to — because I trusted you. I already knew you were strong enough to carry it.' },
    { theme:'Strength', sig:'— Your Father', ps:false,
      text:'I can count on you. You do so much — doctors, flights, calls, long discussions. You wait through surgeries. And every time I go into the operating room, I know I cannot leave this world, because I have a son like you. I will keep fighting to stay in this world — the world in which God blessed me with you.' },
    { theme:'Hope',     sig:'— Your Father', ps:false,
      text:'Right now we are going through a very difficult trial. But in time you will see — I will not leave you. We will defeat this illness together.' },
    { theme:'Together', sig:'— Your Father', ps:false,
      text:'The doctors are fighting for my life. You are fighting for my life. We are doing everything within our power. But you know we have great strength. You are a strong son — and with every action I take, I show, with pride, that I can rely on you.' },
    { theme:'P.S.',     sig:'— Roma',        ps:true,
      text:'Chris, I may not know exactly how everything truly is — but this is what I feel, and I believe it with certainty. You are a wonderful son. Your father is so lucky to have someone like you to lean on at a time like this. You are a good son. You are a good friend. And you will get through all of this — I believe it, and I always will.' }
  ];

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function openFolder() {
    goTo('s2');
    setTimeout(startMusic, 1000);
  }

  function openLetter(i) {
    const l = letters[i];
    document.getElementById('letterTheme').textContent = l.theme;
    document.getElementById('letterText').textContent  = l.text;
    document.getElementById('letterSig').textContent   = l.sig;

    const paper = document.getElementById('letterPaper');
    const theme = document.getElementById('letterTheme');
    const sig   = document.getElementById('letterSig');

    paper.classList.toggle('ps-paper', l.ps);
    theme.classList.toggle('ps-theme', l.ps);
    sig.classList.toggle('ps-sig',   l.ps);

    paper.style.animation = 'none';
    void paper.offsetWidth;
    paper.style.animation = '';
    goTo('s3');
  }
</script>

</body>
</html>
